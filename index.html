<style>
  :root {
    --black: #0F0E0C;
    --charcoal: #2B2926;
    --brass: #B08A4E;
    --cream: #F3EEE2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--black); font-family: 'Inter', sans-serif; }

  .stage {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ---- conveyor belt rows of images ---- */
  .mosaic {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
  }

  .belt-row {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  .belt-track {
    display: flex;
    height: 100%;
    width: max-content;
  }

  .belt-track.left { animation: beltLeft linear infinite; }
  .belt-track.right { animation: beltRight linear infinite; }

  @keyframes beltLeft {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @keyframes beltRight {
    from { transform: translateX(-50%); }
    to { transform: translateX(0); }
  }

  .tile {
    height: 100%;
    aspect-ratio: 1;
    background-size: 145%;
    background-position: center;
    flex-shrink: 0;
    border-right: 2px solid var(--black);
    filter: sepia(0.3) saturate(1.6) hue-rotate(-12deg) brightness(0.92);
  }
  .tile.color { background: var(--charcoal); background-size: cover; }


  /* dark scrim so the overlaid text stays legible */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(20,16,10,0.52);
    z-index: 2;
  }

  /* ---- foreground content ---- */
  .content {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 36px;
  }

    'color:t-charcoal',
  ];

  const mosaic = document.getElementById('mosaic');

  // Build several horizontal rows, each one a continuously scrolling
  // strip of images — like a conveyor belt. Alternating rows scroll
  // in opposite directions for a richer, layered effect.
  const numRows = Math.max(4, Math.ceil(window.innerHeight / 160));
  const tilesPerRow = Math.ceil(window.innerWidth / 130) + 4;

  for (let r = 0; r < numRows; r++) {
    const row = document.createElement('div');
    row.className = 'belt-row';

    const track = document.createElement('div');
    track.className = 'belt-track ' + (r % 2 === 0 ? 'left' : 'right');

    // Randomize speed slightly per row so they don't all move in lockstep
    const duration = 22 + Math.random() * 16; // 22–38s
    track.style.animationDuration = duration + 's';

    // Offset which image each row starts on, so rows don't all show
    // the same images lined up in the same order
    const rowOffset = r * 3;

    // Build the row twice over (duplicated) so the loop is seamless
    for (let rep = 0; rep < 2; rep++) {
      for (let i = 0; i < tilesPerRow; i++) {
        const t = tiles[(rowOffset + i) % tiles.length];
        const div = document.createElement('div');
        if (t.startsWith('color:')) {
          div.className = 'tile color';
        } else {
          div.className = 'tile';
          div.style.backgroundImage = t;
        }

        track.appendChild(div);
      }
    }

    row.appendChild(track);
    mosaic.appendChild(row);
  }
