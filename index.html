<style>
  :root {
    --black: #0F0E0C;
    --charcoal: #2B2926;
    --brass: #B08A4E;
    --cream: #F3EEE2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--black); font-family: 'Inter', sans-serif; }

  .stage {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ---- RippleDistortion hero background ---- */
  .ripple-stage {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: var(--black);
  }

  @keyframes beltLeft {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @keyframes beltRight {
    from { transform: translateX(-50%); }
    to { transform: translateX(0); }
  }

  .tile {
    height: 100%;
    aspect-ratio: 1;
    background-size: 145%;
    background-position: center;
    flex-shrink: 0;
    border-right: 2px solid var(--black);
    filter: sepia(0.3) saturate(1.6) hue-rotate(-12deg) brightness(0.92);
  }
  .tile.color { background: var(--charcoal); background-size: cover; }


  /* dark scrim so the overlaid text stays legible */
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(20,16,10,0.52);
    z-index: 2;
  }

  /* ---- foreground content ---- */
  .content {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 36px;
  }
