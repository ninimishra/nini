<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your wardrobe — Nini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="wardrobe-header">
  <a href="index.html"><div class="wardrobe-logo-small"></div></a>
  <div class="wardrobe-header-right">
    <span id="accountEmail"></span>
    <a href="#" id="logoutBtn">Log out</a>
  </div>
</header>

<!-- Shown if nobody's logged in -->
<main class="wardrobe-main" id="loggedOutView" style="display:none;">
  <p>You need to be logged in to see your wardrobe. <a href="index.html">Go back and log in</a>.</p>
</main>

<!-- View 1: list of a person's wardrobes ("boards") -->
<main class="wardrobe-main" id="boardsView" style="display:none;">
  <div class="wardrobe-topbar">
    <h1>Your wardrobes</h1>
    <button id="newBoardBtn" class="btn-primary">+ New wardrobe</button>
  </div>
  <div class="boards-grid" id="boardsGrid"></div>
  <p class="wardrobe-empty-state" id="boardsEmpty" style="display:none;">You haven't created a wardrobe yet — click "+ New wardrobe" to start.</p>
</main>

<!-- View 2: inside one specific wardrobe -->
<main class="wardrobe-main" id="boardDetailView" style="display:none;">
  <a href="wardrobe.html" class="back-link">← All wardrobes</a>
  <h1 class="board-detail-title" id="boardTitle"></h1>

  <form id="itemForm" class="item-form">
    <div class="item-form-photo">
      <label for="itemPhoto" class="photo-drop" id="photoDrop">
        <span id="photoDropText">Click to add a photo</span>
        <img id="photoPreview" style="display:none;">
      </label>
      <input type="file" id="itemPhoto" accept="image/*" required>
    </div>

    <div class="item-form-fields">
      <label>
        Name
        <input type="text" id="itemName" placeholder="e.g. Cream wool jumper" required>
      </label>
      <label>
        Category
        <select id="itemCategory">
          <option>Top</option>
          <option>Bottom</option>
          <option>Dress</option>
          <option>Outerwear</option>
          <option>Shoes</option>
          <option>Accessory</option>
        </select>
      </label>
      <label>
        Colour
        <input type="text" id="itemColour" placeholder="e.g. Cream">
      </label>
      <label>
        Season
        <select id="itemSeason">
          <option>All seasons</option>
          <option>Spring</option>
          <option>Summer</option>
          <option>Autumn</option>
          <option>Winter</option>
        </select>
      </label>
      <button type="submit" class="btn-primary" id="itemSubmit">Add to wardrobe</button>
      <p class="form-error" id="itemError" style="display:none;"></p>
    </div>
  </form>

  <div class="wardrobe-grid" id="wardrobeGrid"></div>
  <p class="wardrobe-empty" id="wardrobeEmpty" style="display:none;">No pieces yet — add your first one above.</p>
</main>

<!-- Popup for naming a new wardrobe -->
<div class="modal-overlay" id="newBoardOverlay">
  <div class="modal-box">
    <button class="modal-close" id="newBoardClose" aria-label="Close">&times;</button>
    <h3>New wardrobe</h3>
    <p class="modal-subtitle">Give it a name, like "Summer Wishlist" or "Everyday".</p>
    <form id="newBoardForm">
      <label>
        Name
        <input type="text" id="newBoardName" placeholder="e.g. Summer Wishlist" required>
      </label>
      <p class="form-error" id="newBoardError" style="display:none;"></p>
      <button type="submit" class="btn-primary modal-submit">Create wardrobe</button>
    </form>
  </div>
</div>

<script type="module" src="wardrobe.js"></script>
</body>
</html>
