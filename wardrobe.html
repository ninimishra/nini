<style>
  :root {
    --black: #FFFFFF;
    --charcoal: #EDE8DC;
    --brass: #B08A4E;
    --cream: #1A1712;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--black);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 36px;
    border-bottom: 1px solid rgba(26,23,18,0.12);
  }

  .back-btn {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--cream);
    opacity: 0.65;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .back-btn:hover { opacity: 1; }

  main {
    display: block;
    min-height: 0;
    text-align: left;
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 32px 100px;
  }
  main h1 { font-size: inherit; }
  main p { margin-top: 0; font-size: inherit; color: inherit; }

  /* ---- "Wardrobe" tape banner, reusing the same torn-paper / sellotape
       artwork as the Journal page's "This week's finds" box, relabelled
       for Wardrobe. ---- */
  .wardrobe-tape-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
  }
  .wardrobe-tape h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(32px, 4.6vw, 46px);
    margin: 0;
    color: var(--cream);
    text-shadow: 0 1px 4px rgba(255,255,255,0.7), 0 1px 1px rgba(255,255,255,0.8);
  }
  .wardrobe-tape p {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: rgba(26,23,18,0.88);
    max-width: 320px;
    margin: 0;
    text-shadow: 0 1px 2px rgba(255,255,255,0.85), 0 1px 6px rgba(255,255,255,0.6);
  }

  .how-it-works-btn {
    position: relative;
    z-index: 2;
    align-self: flex-start;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--black);
    background: var(--brass);
    border: none;
    border-radius: 999px;
    padding: 11px 24px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .how-it-works-btn:hover { transform: translateY(-1px); opacity: 0.92; }

  /* ---- layout: LineSidebar categories + wardrobe grid ---- */
  .wardrobe-layout {
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 48px;
    margin-top: 56px;
  }
  @media (max-width: 720px) {
    .wardrobe-layout { grid-template-columns: 1fr; }
  }

  .wardrobe-sidebar {
    padding-top: 6px;
  }
  .wardrobe-sidebar-title {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    margin-bottom: 6px;
  }

  .wardrobe-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 32px;
    align-content: start;
  }

  .wardrobe-card {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .wardrobe-card-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 4/5;
  }

  .wardrobe-card-delete {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 4;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 999px;
    border: none;
    background: rgba(26,23,18,0.55);
    color: #fff;
    font-size: 17px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.15s ease, background 0.15s ease;
  }
  .wardrobe-card-stage:hover .wardrobe-card-delete,
  .wardrobe-card-delete:focus {
    opacity: 1;
  }
  .wardrobe-card-delete:hover {
    background: #B3453A;
  }

  .wardrobe-card-name {
    width: 100%;
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 16px;
    color: var(--cream);
    background: var(--charcoal);
    border: 1px solid rgba(26,23,18,0.12);
    border-radius: 6px;
    padding: 9px 12px;
    text-align: center;
  }
  .wardrobe-card-name:focus {
    outline: none;
    border-color: var(--brass);
  }

  .wardrobe-open-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--cream);
    background: var(--charcoal);
    border: 1px solid rgba(26,23,18,0.12);
    border-radius: 999px;
    padding: 10px 0;
    width: 100%;
    cursor: pointer;
    overflow: visible;
    transition: background 0.2s ease;
  }
  .wardrobe-open-btn:hover { background: rgba(176,138,78,0.14); }
  .wardrobe-open-btn span { position: relative; z-index: 2; }

  /* ---- "add new wardrobe" placeholder card ---- */
  .add-wardrobe-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    aspect-ratio: 4/5;
    width: 100%;
    background: transparent;
    border: 1.5px dashed rgba(26,23,18,0.25);
    border-radius: 12px;
    color: rgba(26,23,18,0.55);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }
  .add-wardrobe-card:hover {
    border-color: var(--brass);
    color: var(--brass);
  }
  .add-wardrobe-card .plus {
    font-size: 30px;
    line-height: 1;
    font-weight: 400;
  }

  /* ---- How it works: Stepper modal ---- */
  .stepper-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,23,18,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 999;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.2s ease;
  }
  .stepper-overlay.is-open { opacity: 1; visibility: visible; }

  .stepper-modal-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    color: var(--cream);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    z-index: 3;
  }

  .outer-container {
    display: flex;
    flex-direction: column;
    width: 100%;
  }
  .step-circle-container {
    position: relative;
    margin: 0 auto;
    width: 100%;
    max-width: 420px;
    background: var(--black);
    border-radius: 16px;
    padding: 32px 30px 26px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
  }
  .step-indicator-row {
    display: flex;
    align-items: center;
    margin-bottom: 26px;
  }
  .step-indicator {
    position: relative;
    cursor: pointer;
    outline: none;
  }
  .step-indicator-inner {
    display: flex;
    height: 28px;
    width: 28px;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    font-weight: 600;
    font-size: 12.5px;
    background: var(--charcoal);
    color: rgba(26,23,18,0.6);
    transition: background 0.25s ease, color 0.25s ease;
  }
  .step-indicator[data-status="active"] .step-indicator-inner,
  .step-indicator[data-status="complete"] .step-indicator-inner {
    background: var(--brass);
    color: var(--black);
  }
  .step-connector {
    position: relative;
    margin: 0 6px;
    height: 2px;
    flex: 1;
    overflow: hidden;
    border-radius: 2px;
    background: rgba(26,23,18,0.14);
  }
  .step-connector-fill {
    position: absolute;
    left: 0; top: 0; height: 100%;
    width: 0%;
    background: var(--brass);
    transition: width 0.3s ease;
  }
  .step-content-default {
    position: relative;
    min-height: 150px;
  }
  .step-default h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 21px;
    color: var(--cream);
    margin-bottom: 10px;
  }
  .step-default p {
    font-size: 14px;
    line-height: 1.55;
    color: rgba(26,23,18,0.72);
  }
  .footer-nav {
    display: flex;
    margin-top: 22px;
  }
  .footer-nav.spread { justify-content: space-between; }
  .footer-nav.end { justify-content: flex-end; }
  .back-button {
    background: none;
    border: none;
    font-size: 13px;
    color: rgba(26,23,18,0.55);
    cursor: pointer;
    padding: 6px 4px;
  }
  .back-button:hover { color: var(--cream); }
  .next-button {
    background: var(--brass);
    color: var(--black);
    border: none;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 22px;
    cursor: pointer;
  }

  /* ---- LineSidebar (ported from React Bits) ---- */
  .line-sidebar {
    --accent-color: #B08A4E;
    --text-color: #1A1712;
    --marker-color: rgba(26,23,18,0.35);
    --marker-length: 60px;
    --marker-gap: 4px;
    --tick-scale: 0.5;
    --max-shift: 30px;
    --item-gap: 20px;
    --font-size: 1.1rem;
    --smoothing: 100ms;
    position: relative;
    display: flex;
    justify-content: flex-start;
  }
  .line-sidebar--markers {
    padding-left: calc(var(--marker-length) + var(--marker-gap));
  }
  .line-sidebar__list {
    list-style: none;
    margin: 0;
    padding: 1rem 0;
    display: flex;
    flex-direction: column;
    gap: var(--item-gap);
  }
  .line-sidebar__item {
    position: relative;
    cursor: pointer;
  }
  .line-sidebar__item::before {
    content: '';
    position: absolute;
    inset: -6px -20px;
  }
  .line-sidebar__label {
    position: relative;
    display: inline-flex;
    align-items: baseline;
    font-size: var(--font-size);
    line-height: 1.2;
    color: color-mix(in srgb, var(--accent-color) calc(var(--effect, 0) * 100%), var(--text-color));
    transform: translateX(calc(var(--effect, 0) * var(--max-shift)));
  }
  .line-sidebar__index {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    margin-right: 0.6rem;
    font-size: 0.78em;
    opacity: calc(0.55 + var(--effect, 0) * 0.45);
  }
  .line-sidebar__marker {
    position: absolute;
    top: 50%;
    left: calc(-1 * var(--marker-length) - var(--marker-gap));
    height: 1px;
    width: var(--marker-length);
    background-color: color-mix(in srgb, var(--accent-color) calc(var(--effect, 0) * 100%), var(--marker-color));
    transform-origin: left center;
    transform: translateY(-50%) scaleX(calc(0.7 + var(--effect, 0) * 0.5));
  }
  .line-sidebar--markers .line-sidebar__item:not(:last-child)::after {
    content: '';
    position: absolute;
    top: calc(100% + var(--item-gap) / 2);
    left: calc(-1 * var(--marker-length) - var(--marker-gap));
    height: 1px;
    width: calc(var(--marker-length) * var(--tick-scale));
    background-color: var(--marker-color);
    opacity: 0.6;
    transform: translateY(-50%);
  }
  .line-sidebar--scale-tick .line-sidebar__item:not(:last-child)::after {
    transform-origin: left center;
    transform: translateY(-50%) scaleX(calc(0.7 + var(--effect, 0) * 0.6));
  }

  /* ---- TiltedCard (ported from React Bits) ---- */
  .tilted-card-figure {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .tilted-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
  }
  .tilted-card-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
    will-change: transform;
  }
  .tilted-card-overlay {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    padding: 12px;
    will-change: transform;
  }
  .tilted-card-overlay p {
    color: #fff;
    font-size: 12.5px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    margin: 0;
  }
</style>
