  main { max-width: 1200px; margin: 0 auto; padding: 48px 32px 100px; }

  h1.page-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(32px, 4.6vw, 50px);
    margin-bottom: 28px;
  }

  /* ---- brand row across the top ---- */
  .brand-row {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 22px;
    margin-bottom: 36px;
    border-bottom: 1px solid rgba(26,23,18,0.12);
  }
  .brand-btn {
    flex-shrink: 0;
    width: 92px;
    height: 92px;
    border-radius: 8px;
    background: var(--charcoal);
    border: 1px solid rgba(26,23,18,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(26,23,18,0.75);
    padding: 8px;
    cursor: default;
  }

  /* ---- layout: side category panel + grid ---- */
  .clothes-layout { display: grid; grid-template-columns: 180px 1fr; gap: 40px; }
  @media (max-width: 720px) { .clothes-layout { grid-template-columns: 1fr; } }

  .category-panel { display: flex; flex-direction: column; gap: 10px; }
  .cat-btn {
    background: var(--charcoal);
    border: 1px solid rgba(26,23,18,0.1);
    border-radius: 6px;
    padding: 18px 16px;
    font-size: 13.5px;
    font-weight: 600;
    color: rgba(26,23,18,0.75);
    text-align: left;
    cursor: pointer;
  }
  .cat-btn:hover { border-color: var(--brass); }
  .cat-btn.is-active { background: var(--brass); color: var(--black); }

  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 24px;
    align-content: start;
  }
  .product-card {
    display: block;
    background: var(--charcoal);
    border-radius: 6px;
    overflow: hidden;
    transition: transform 0.15s ease;
  }
  .product-card:hover { transform: translateY(-3px); }
  .product-card img { width: 100%; aspect-ratio: 4/5; object-fit: cover; display: block; background: #E3DDCF; }
  .product-card-info { padding: 12px 14px 16px; }
  .product-card-brand { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass); margin-bottom: 4px; }
  .product-card-name { font-size: 13.5px; line-height: 1.4; color: var(--cream); }

  .empty-state { font-size: 14px; color: rgba(26,23,18,0.45); padding: 20px 0; grid-column: 1 / -1; }
</style>
</head>
<body>

<header>
  <a href="index.html"><div class="logo-mark"></div></a>
</header>

<main>
  <h1 class="page-title">Clothes</h1>

  <div class="brand-row" id="brandRow"></div>

  <div class="clothes-layout">
    <aside class="category-panel" id="categoryPanel"></aside>
    <div class="product-grid" id="clothesGrid"></div>
  </div>
</main>

<script type="module" src="clothes.js"></script>
</body>
</html>
